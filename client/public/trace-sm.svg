<svg xmlns="http://www.w3.org/2000/svg" width="120" height="42" viewBox="0 0 120 42">
  <!--
    نسخة المقاسات الصغيرة — صفّ المنظّم (ارتفاع الموجة 22px).

    هذا هو الرسم الأصلي بموجتَي P وT وإيقاعه المتقارب. وهو المناسب هنا لا
    الرسمُ المهذّب: عند اثنين وعشرين بكسلاً يخرج بطن الموجة أقلّ من بكسلين،
    فلا أحد يراه — بينما اختفاءُ الموجتين يُفقر الشكل حتى يصير طلوعاً واحداً،
    وتباعُدُ النبضات يجعل المجرى فارغاً.

    ومعه يُرسم خطّ الأساس شريطاً مصمتاً (.lane-line) — وهو ضرورةٌ في هذا
    المقاس وحده: القلم يخرج هنا 1.57px، والخطّ الأفقيّ بهذا الرقّ يذوب
    فتُقرأ النبضات متقطّعة. أما المقاسات الكبيرة فلا شريط خلفها البتّة.
  -->
