<svg xmlns="http://www.w3.org/2000/svg" width="120" height="42" viewBox="0 0 120 42">
  <!--
    يُقرأ من اليمين إلى اليسار: موجة P، ثم Q-R-S، ثم موجة T.

    خطّ الأساس عند y=21 — منتصف الارتفاع بالضبط. وهذا شرطٌ لا زينة:
    القناع يُوسَّط داخل المجرى، فإن لم يكن الأساس في منتصف الرسم ظهر
    الخطّ الواصل تحت الموجات أو فوقها فبدا المجرى خطّين لا خطاً واحداً.

    وموجتا P وT تُرسمان بمنحنيات مكعّبة ضيّقة لا بأقواس عريضة: القوس
    العريض يخرج قبّةً زخرفية، والقلمُ السميك يبتلع الموجة القصيرة حتى
    تُقرأ نتوءاً ملتصقاً بالخطّ. فالقلم 2.4 — أرقّ من ارتفاع أقصر
    موجة — وP أخفض من T كما هي في المخطّط الحقيقي.
  -->
  <path d="M120 21h-16c-2 0-3-5-5-5c-2 0-3 5-5 5h-5l-3 3l-3.5-22l-3.5 26l-3-7h-7c-3 0-5-7-8-7c-3 0-5 7-8 7h-53"
        fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
