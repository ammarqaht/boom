<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: T; src: url('../../client/public/fonts/thmanyahsans-Black.otf'); font-weight: 900; }
  html, body { margin: 0; background: transparent; }
  .stage { position: relative; width: 256px; height: 256px; overflow: visible; }
  .stage > * { position: absolute; }
  .drop { filter: drop-shadow(0 6px 8px rgb(0 0 0 / 0.45)); }
  [data-art] { display: none; }
  [data-art].on { display: block; }
</style>
</head>
<body>

<div class="stage" data-art="quran">
  <img src="out/green_book.png" style="inset: 0; width: 256px">
  <svg viewBox="0 0 256 256" style="inset: 0; width: 256px; height: 256px">
    <defs>
      <linearGradient id="q-medal" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f2fcff"/><stop offset="1" stop-color="#8fe3ff"/>
      </linearGradient>
    </defs>
    <rect x="62" y="30" width="142" height="184" rx="7" fill="none" stroke="#eafaff" stroke-width="3" opacity="0.9"/>
    <rect x="70" y="38" width="126" height="168" rx="4" fill="none" stroke="#eafaff" stroke-width="1.4" opacity="0.6"/>
    <g fill="#eafaff" opacity="0.85">
      <path d="M70 38l9 0-9 9z"/><path d="M196 38l-9 0 9 9z"/><path d="M70 206l9 0-9-9z"/><path d="M196 206l-9 0 9-9z"/>
    </g>
    <path d="M133 70 145.8 91.2 170 96.2 154.2 115 156.8 139.6 133 129.6 109.2 139.6 111.8 115 96 96.2 120.2 91.2Z" fill="none"/>
    <g transform="translate(133 122)">
      <rect x="-40" y="-40" width="80" height="80" fill="url(#q-medal)"/>
      <rect x="-40" y="-40" width="80" height="80" fill="url(#q-medal)" transform="rotate(45)"/>
      <circle r="38" fill="#0b3a52"/>
      <circle r="33" fill="none" stroke="#bff0ff" stroke-width="1.6"/>
      <text y="7" text-anchor="middle" font-family="T" font-weight="900" font-size="25" fill="#eafaff">القرآن</text>
    </g>
  </svg>
</div>

<div class="stage" data-art="lugha">
  <div class="drop" style="left: 10px; top: 22px; width: 190px; height: 128px; border-radius: 18px;
       background: linear-gradient(160deg, #f2fcff, #8fe3ff); transform: rotate(-7deg);
       display: flex; align-items: center; justify-content: center;
       font: 900 64px/1 T; color: #0b3a52; box-shadow: inset 0 -6px 0 rgb(11 58 82 / 0.18);">معنى</div>
  <img class="drop" src="out/magnifying_glass_tilted_left.png" style="left: 118px; top: 116px; width: 138px">
</div>

<div class="stage" data-art="sahaba">
  <img src="out/crescent_moon.png" style="right: -6px; top: -4px; width: 112px">
  <img class="drop" src="out/mosque.png" style="left: 0; top: 40px; width: 216px">
</div>

<div class="stage" data-art="tarikh">
  <img src="out/mosque.png" style="left: 0; top: 0; width: 220px">
  <img class="drop" src="out/hourglass_not_done.png" style="right: -4px; bottom: -4px; width: 118px">
</div>

<div class="stage" data-art="seerah">
  <div style="right: 22px; top: 12px; width: 84px; height: 84px; border-radius: 50%;
       box-shadow: inset -20px 10px 0 0 #dff7ff; filter: drop-shadow(0 0 12px rgb(143 227 255 / 0.85));
       transform: rotate(-12deg);"></div>
  <div style="right: 118px; top: 26px; width: 5px; height: 5px; border-radius: 50%; background: #dff7ff; box-shadow: 0 0 6px #8fe3ff;"></div>
  <div style="right: 150px; top: 58px; width: 3.5px; height: 3.5px; border-radius: 50%; background: #dff7ff; opacity: 0.8;"></div>
  <div style="right: 96px; top: 84px; width: 3px; height: 3px; border-radius: 50%; background: #dff7ff; opacity: 0.7;"></div>
  <div style="left: 40px; top: 30px; width: 4px; height: 4px; border-radius: 50%; background: #dff7ff; opacity: 0.85; box-shadow: 0 0 5px #8fe3ff;"></div>
  <img src="out/palm_tree.png" style="left: 26px; top: 104px; width: 96px">
  <div style="left: -6px; right: -6px; bottom: 6px; height: 64px; border-radius: 50% 50% 0 0 / 100% 100% 0 0;
       background: linear-gradient(#1a7fae, #0b3a52);"></div>
  <img class="drop" src="out/camel.png" style="left: 62px; top: 74px; width: 158px; filter: drop-shadow(0 8px 10px rgb(0 0 0 / 0.5)) drop-shadow(0 0 1.5px #06141d);">
</div>

<div class="stage" data-art="football-world">
  <img src="out/trophy.png" style="right: 26px; top: 4px; width: 168px">
  <img class="drop" src="out/soccer_ball.png" style="left: 22px; bottom: 10px; width: 132px">
</div>

<script>
  const name = location.hash.slice(1);
  document.querySelector(`[data-art="${name}"]`)?.classList.add('on');
</script>
</body>
</html>
